[project]
name = "nano-vibe-coder"
version = "0.1.0"
description = "A small, inspectable coding agent for local Git repositories."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "fastapi>=0.115.0",
    "rich>=13.7.0",
    "tavily-python>=0.5.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
    "websockets>=12.0",
]

[project.scripts]
nano-vibe = "nano_vibe.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nano_vibe"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
